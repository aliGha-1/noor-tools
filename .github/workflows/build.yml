name: Build Noor Tools APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تنزيل ملفات المشروع
        uses: actions/checkout@v4

      - name: تجهيز Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تجهيز Android SDK
        uses: android-actions/setup-android@v3

      - name: تثبيت مكونات Android المطلوبة
        shell: bash
        run: |
          set -e
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: تجهيز ملفات مشروع Android
        shell: bash
        run: |
          set -e

          if [ -f "index.html" ]; then
            APP_HTML="index.html"
          elif [ -f "index-2.html" ]; then
            APP_HTML="index-2.html"
          else
            echo "لم يتم العثور على ملف HTML."
            echo "الملفات الموجودة:"
            ls -la
            exit 1
          fi

          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/java/com/noortools/app

          cp "$APP_HTML" android/app/src/main/assets/index.html

          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NoorTools"
          include(":app")
          EOF

          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > android/gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.noortools.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.noortools.app'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="نور تولز"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name="com.noortools.app.MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > android/app/src/main/java/com/noortools/app/MainActivity.java <<'EOF'
          package com.noortools.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WebView webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());

                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF

      - name: تجهيز Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: بناء APK
        shell: bash
        run: |
          set -e
          cd android
          gradle assembleDebug

      - name: حفظ ملف APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Tools-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
